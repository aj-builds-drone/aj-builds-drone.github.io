<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UAV-IQ high-tunnel UAV — 3D viewer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #eef1f4; font: 13px system-ui, sans-serif; }
  canvas { display: block; }
  #ui { position: absolute; top: 8px; left: 8px; z-index: 2; background: #ffffffeb; border-radius: 8px; padding: 8px 10px;
        box-shadow: 0 1px 4px #0003; max-width: 370px; max-height: calc(100% - 56px); overflow-y: auto; }
  #ui h1 { font-size: 14px; margin: 0 0 6px; cursor: pointer; user-select: none; }
  #ui h1::after { content: " \25BE"; color: #888; }
  #ui.min h1 { margin: 0; }
  #ui.min h1::after { content: " \25B8  (show controls)"; font-weight: normal; font-size: 12px; }
  #ui.min .row { display: none; }
  #ui button { margin: 2px 2px 2px 0; padding: 3px 7px; font-size: 12px; cursor: pointer; }
  #ui button.big { font-weight: 600; }
  #ui label { display: inline-block; margin: 3px 8px 3px 0; }
  #ui .row { margin: 4px 0; }
  #ui .hd { font-weight: 600; margin-top: 8px; padding-top: 6px; border-top: 1px solid #dde2e8; }
  #ui .note { color: #666; font-size: 12px; }
  #ui input[type=range] { vertical-align: middle; width: 130px; }
  #perf { background: #f2f4f7; border-radius: 6px; padding: 5px 8px; line-height: 1.45; }
  #status { position: absolute; bottom: 8px; left: 8px; color: #555; z-index: 2; }
  #legend { position: absolute; bottom: 8px; right: 8px; background: #ffffffe6; border-radius: 8px; padding: 6px 10px; z-index: 2; }
  .sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -2px; margin: 0 4px 0 10px; }
  #overlay { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 1; }
  #tip { position: absolute; pointer-events: none; background: #1f2630ee; color: #fff; padding: 4px 8px; border-radius: 4px;
         font-size: 12px; display: none; white-space: pre; z-index: 3; max-width: 520px; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="ui">
  <h1>Proposed high-tunnel UAV (Option A)</h1>
  <div class="row">
    <button data-view="iso_front">3/4 front</button><button data-view="iso_rear">3/4 rear</button>
    <button data-view="front">Front</button><button data-view="left">Side</button>
    <button data-view="top">Top</button><button data-view="bottom">Bottom</button>
  </div>
  <div class="row">
    Colours:
    <label><input type="radio" name="mode" value="built" checked> as built</label>
    <label><input type="radio" name="mode" value="status"> reuse / replace / add</label>
  </div>
  <div class="row hd">Releaser</div>
  <div class="row">
    <label><input type="radio" name="rel" value="none"> none</label>
    <label><input type="radio" name="rel" value="1L" checked> 1 L</label>
    <label><input type="radio" name="rel" value="2L"> 2 L</label>
    <label><input type="radio" name="rel" value="4L"> 4 L</label>
  </div>
  <div class="row" id="perf"></div>
  <div class="row hd">Show</div>
  <div class="row">
    <label><input type="checkbox" id="fov"> sensor fields of view</label>
    <label><input type="checkbox" id="dims"> dimensions</label>
    <label><input type="checkbox" id="labels" checked> labels</label>
    <label><input type="checkbox" id="spin"> spin props</label>
  </div>
  <div class="row">Compare size:
    <label><input type="checkbox" class="cmp" value="0"> UCLA X500</label>
    <label><input type="checkbox" class="cmp" value="1"> Starling 2 Max</label>
  </div>
  <div class="row">
    <button id="burst" class="big">Burst ▸</button>
    <input type="range" id="explode" min="0" max="100" value="0"> <span id="explodev">0 %</span>
  </div>
  <div class="row hd">Scene</div>
  <div class="row">
    <button id="tunnel" class="big">Put it in a high tunnel</button>
    <button data-view="tunnel_iso" class="tview">Behind, above</button><button data-view="tunnel_end" class="tview">Along the row</button>
  </div>
  <div class="row note">Hover a part for its status, mass and price; double-click to zoom. Releaser shapes are assumed
    (the brief gives masses only) and the tunnel is illustrative.</div>
</div>
<canvas id="overlay"></canvas>
<div id="tip"></div>
<div id="legend"></div>
<div id="status">loading…</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const params = new URLSearchParams(location.search);
const capture = params.has('capture');
const $ = id => document.getElementById(id);
const status = $('status');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(capture ? 1 : window.devicePixelRatio);
document.body.appendChild(renderer.domElement);
const overlay = $('overlay'), octx = overlay.getContext('2d');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeef1f4);
const camera = new THREE.PerspectiveCamera(30, 1, 5, 60000);
camera.up.set(0, 0, 1);
let controls = new OrbitControls(camera, renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f99, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
const fill = new THREE.DirectionalLight(0xffffff, 0.6);
key.position.set(-500, -700, 900);
fill.position.set(700, 500, 300);
scene.add(key, fill);

const man = await (await fetch('manifest.json')).json();
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const V3 = a => new THREE.Vector3(a[0], a[1], a[2]);
const rad = THREE.MathUtils.degToRad;
const grid = new THREE.GridHelper(3000, 30, 0xb9c0c8, 0xd5dae0);
grid.rotation.x = Math.PI / 2; grid.position.z = man.ground_z; scene.add(grid);
let gridOn = true;   // off for the animations: a plain background keeps the GIFs small

const matCache = new Map();
function mat(color, o = {}) {
  const k = color + JSON.stringify(o);
  if (!matCache.has(k)) matCache.set(k, new THREE.MeshStandardMaterial({ color: new THREE.Color(color), roughness: 0.55,
                                                                         metalness: 0.05, ...o }));
  return matCache.get(k);
}
const edgeMat = new THREE.LineBasicMaterial({ color: 0x1b1f24, transparent: true, opacity: 0.35 });
const UPZ = V(0, 0, 1), UPY = V(0, 1, 0);

// ---- the aircraft -----------------------------------------------------------------
const root = new THREE.Group(); scene.add(root);
const meshes = [], movers = [], pickable = [], props = [], motorGroups = [];
function mover(o, ex) {
  o.userData.base = o.position.clone();
  o.userData.ex = ex ? V3(ex) : V(0, 0, 0);
  movers.push(o);
}
function itemMesh(it) {
  let geo;
  const m = new THREE.Mesh();
  if (it.shape === 'box') {
    geo = new THREE.BoxGeometry(it.size[0] - 0.4, it.size[1] - 0.4, it.size[2] - 0.4);
    m.rotation.z = rad(it.yaw || 0);
    m.position.set(...it.pos);
  } else if (it.shape === 'cyl') {
    geo = new THREE.CylinderGeometry(it.r - 0.2, it.r - 0.2, it.h - 0.4, 48);
    m.quaternion.setFromUnitVectors(UPY, V3(it.axis).normalize());
    m.position.set(...it.pos);
  } else {
    const a = V3(it.a), b = V3(it.b);
    geo = new THREE.CylinderGeometry(it.od / 2, it.od / 2, a.distanceTo(b), 24);
    m.quaternion.setFromUnitVectors(UPY, b.clone().sub(a).normalize());
    m.position.copy(a.add(b).multiplyScalar(0.5));
  }
  m.geometry = geo;
  if (it.shape === 'box') m.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 25), edgeMat));
  m.userData = { ...it, kind: 'item' };
  return m;
}
for (const it of man.items) {
  const m = itemMesh(it);
  root.add(m); meshes.push(m); pickable.push(m);
  mover(m, it.burst);
}

const motorMats = { stator: mat('#3b3e42', { metalness: 0.6, roughness: 0.4 }), bell: mat('#6b737c', { metalness: 0.7, roughness: 0.35 }),
                    blade: mat('#18191b', { roughness: 0.35, metalness: 0.2 }),
                    disc: new THREE.MeshStandardMaterial({ color: 0x9aa3ad, roughness: 0.6, transparent: true, opacity: 0.22,
                                                           depthWrite: false, side: THREE.DoubleSide }) };
const R = man.prop.d / 2;
for (const mo of man.motors) {
  const g = new THREE.Group();
  g.position.set(...mo.pos);
  const cylZ = (r, h, z, m) => {
    const c = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 40), m);
    c.rotation.x = Math.PI / 2; c.position.z = z; return c;
  };
  const stator = cylZ(man.motor.r - 3, 5, 2.5, motorMats.stator);
  const bell = cylZ(man.motor.r, man.motor.h - 5, 5 + (man.motor.h - 5) / 2, motorMats.bell);
  const shaft = cylZ(3, man.prop.z - mo.pos[2] - man.motor.h + 6, (man.motor.h + man.prop.z - mo.pos[2]) / 2, motorMats.stator);
  stator.userData.part = 'stator'; bell.userData.part = 'bell'; shaft.userData.part = 'stator';
  const prop = new THREE.Group();
  prop.position.z = man.prop.z - mo.pos[2];
  const disc = new THREE.Mesh(new THREE.CircleGeometry(R, 72), motorMats.disc);
  disc.userData.part = 'disc';
  prop.add(disc);
  for (const s of [1, -1]) {
    const blade = new THREE.Mesh(new THREE.SphereGeometry(1, 28, 10), motorMats.blade);
    blade.scale.set(R * 0.47, 15, 2.2); blade.position.x = s * R * 0.52;
    blade.rotation.x = s * 0.12;
    blade.userData.part = 'blade';
    prop.add(blade);
  }
  const hub = cylZ(10, 9, 0, motorMats.stator);
  hub.userData.part = 'stator';
  prop.add(hub);
  prop.rotation.z = Math.random() * Math.PI;
  prop.userData = { kind: 'prop', label: man.prop.label, status: 'replace', price: man.prop.price, dir: mo.dir,
                    role: `16 in carbon prop, ${mo.dir > 0 ? 'counter-clockwise' : 'clockwise'} (PX4 quad X)` };
  g.add(stator, bell, shaft, prop);
  g.userData = { kind: 'motor', label: man.motor.label, status: 'replace', mass_g: man.motor.mass_g, price: man.motor.price,
                 role: man.motor.role, tag: mo.tag, primary: true };
  root.add(g); motorGroups.push(g); props.push(prop); pickable.push(g);
  mover(g, mo.burst);
  mover(prop, [0, 0, man.prop.burst_z]);
}

// ---- sensor fields of view, dimensions and size comparison ------------------------------
const helpers = new THREE.Group(); helpers.userData.helper = true; root.add(helpers);
const fovGroup = new THREE.Group(), dimGroup = new THREE.Group(), cmpGroup = new THREE.Group();
helpers.add(fovGroup, dimGroup, cmpGroup);
fovGroup.visible = dimGroup.visible = false;
const ghost = (color, opacity) => new THREE.MeshBasicMaterial({ color: new THREE.Color(color), transparent: true, opacity,
                                                               depthWrite: false, side: THREE.DoubleSide });
const lineMat = color => new THREE.LineBasicMaterial({ color: new THREE.Color(color) });
let fovLabels = [];
function buildFov(inTunnel) {
  fovGroup.clear();
  fovLabels = [];
  const F = man.fov;
  // RealSense D455: a frustum ahead of the camera.
  {
    const f = F.d455, far = inTunnel ? f.far_tunnel : f.far_air, a = V3(f.apex);
    const th = Math.tan(rad(f.h / 2)) * far, tv = Math.tan(rad(f.v / 2)) * far;
    const c = [[th, tv], [-th, tv], [-th, -tv], [th, -tv]].map(([y, z]) => V(a.x + far, a.y + y, a.z + z));
    const pos = [];
    for (let i = 0; i < 4; i++) pos.push(a.x, a.y, a.z, ...c[i].toArray(), ...c[(i + 1) % 4].toArray());
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    fovGroup.add(new THREE.Mesh(g, ghost('#1a73e8', 0.10)));
    const lp = [];
    for (let i = 0; i < 4; i++) lp.push(a, c[i], c[i], c[(i + 1) % 4]);
    fovGroup.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(lp), lineMat('#1a73e8')));
    fovLabels.push({ p: V(a.x + far, a.y, a.z + tv), text: `D455 depth: ${f.h}° × ${f.v}°, best 0.6–6 m`, color: '#1a73e8' });
  }
  // ARK Flow: optical-flow cone and the time-of-flight beam, down to the ground or the canopy.
  {
    const f = F.flow, a = V3(f.apex), len = a.z - (inTunnel ? f.to_tunnel : f.to_air);
    const cone = new THREE.Mesh(new THREE.ConeGeometry(len * Math.tan(rad(f.cone / 2)), len, 48, 1, true), ghost('#2e7d32', 0.12));
    cone.rotation.x = Math.PI / 2; cone.position.set(a.x, a.y, a.z - len / 2);
    const beam = new THREE.Mesh(new THREE.ConeGeometry(Math.max(4, len * Math.tan(rad(f.beam / 2))), len, 16, 1, true), ghost('#e65100', 0.55));
    beam.rotation.x = Math.PI / 2; beam.position.copy(cone.position);
    fovGroup.add(cone, beam);
    fovLabels.push({ p: V(a.x, a.y, a.z - len * 0.7), text: inTunnel ? 'ARK Flow: velocity + height above the canopy'
                                                              : 'ARK Flow: optical flow + range beam down', color: '#2e7d32' });
  }
  // ARK DIST LR: a narrow beam up to the roof, or to the light above.
  {
    const f = F.dist, a = V3(f.apex), T = man.tunnel;
    const len = inTunnel ? T.lights.z - T.lights.size[2] / 2 - man.fly_z - a.z : f.len_air;
    const beam = new THREE.Mesh(new THREE.ConeGeometry(Math.max(4, len * Math.tan(rad(f.beam / 2))), len, 16, 1, true), ghost('#e65100', 0.55));
    beam.rotation.x = -Math.PI / 2; beam.position.set(a.x, a.y, a.z + len / 2);
    fovGroup.add(beam);
    fovLabels.push({ p: V(a.x, a.y, a.z + len * 0.8),
                     text: inTunnel ? `ARK DIST: ${(len / 1000).toFixed(1)} m to the light above` : 'ARK DIST: range up to the roof',
                     color: '#e65100' });
  }
  // LightWare SF45/B: the 320° scan plane.
  {
    const f = F.sf45, r = inTunnel ? f.r_tunnel : f.r_air, half = rad(f.arc / 2);
    const ring = new THREE.Mesh(new THREE.RingGeometry(35, r, 96, 1, -half, 2 * half), ghost('#7b1fa2', 0.10));
    ring.position.set(...f.center);
    const arc = [];
    for (let i = 0; i <= 96; i++) { const t = -half + 2 * half * i / 96; arc.push(V(r * Math.cos(t), r * Math.sin(t), 0)); }
    const rim = new THREE.Line(new THREE.BufferGeometry().setFromPoints(arc), lineMat('#7b1fa2'));
    rim.position.copy(ring.position);
    fovGroup.add(ring, rim);
    fovLabels.push({ p: V(f.center[0] - r * 0.55, f.center[1] - r * 0.55, f.center[2]),
                     text: `SF45/B: ${f.arc}° obstacle scan, 0.2–50 m`, color: '#7b1fa2' });
  }
  fovGroup.traverse(o => { o.userData.helper = true; });
}
buildFov(false);

let dimLabels = [];
{
  const pts = [];
  for (const d of man.dims) {
    const a = V3(d.a), b = V3(d.b), dir = b.clone().sub(a).normalize();
    const n = Math.abs(dir.z) > 0.9 ? V(1, 0, 0) : V(0, 0, 1);
    pts.push(a, b, a.clone().addScaledVector(n, -25), a.clone().addScaledVector(n, 25),
             b.clone().addScaledVector(n, -25), b.clone().addScaledVector(n, 25));
    dimLabels.push({ p: a.clone().add(b).multiplyScalar(0.5), a: a.clone(), b: b.clone(), text: d.text });
  }
  dimGroup.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), lineMat('#4a5563')));
}

const cmpSets = [];
let cmpLabels = [];
man.compare.forEach((c, i) => {
  const g = new THREE.Group(), lm = lineMat(c.color), z = man.prop.z + 2 + i;
  const circle = (cx, cy, r) => {
    const p = [];
    for (let k = 0; k <= 72; k++) p.push(V(cx + r * Math.cos(k * Math.PI / 36), cy + r * Math.sin(k * Math.PI / 36), z));
    return new THREE.Line(new THREE.BufferGeometry().setFromPoints(p), lm);
  };
  for (const [x, y] of c.motors) g.add(circle(x, y, c.prop_d / 2));
  const [bx, by] = c.body.map(v => v / 2);
  g.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints([V(bx, by, z), V(-bx, by, z), V(-bx, -by, z), V(bx, -by, z)]), lm));
  g.visible = false;
  const far = Math.max(...c.motors.map(([x, y]) => Math.hypot(x, y))) + c.prop_d / 2;
  g.userData.label = { p: V(-far / Math.SQRT2, -far / Math.SQRT2, z), text: c.name, color: c.color };
  cmpGroup.add(g); cmpSets.push(g);
});

// ---- the high tunnel (illustrative) ----------------------------------------------------
let tunnel = null, tunnelOn = false, tunnelLabels = [];
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
function buildTunnel() {
  const T = man.tunnel, g = new THREE.Group(), L = T.length, a = T.width / 2, b = T.ridge - T.wall;
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(L + 3000, T.width + 3000), mat('#a08868', { roughness: 1 }));
  ground.position.z = -2; g.add(ground);
  const B = T.beds, rand = rng(7);
  const plantGeo = new THREE.IcosahedronGeometry(B.plant_r, 1), perBed = Math.floor(B.length / B.pitch);
  const plants = new THREE.InstancedMesh(plantGeo, mat('#3d8b37', { roughness: 0.8 }), B.y.length * B.rows.length * perBed);
  const dummy = new THREE.Object3D();
  let k = 0;
  for (const y of B.y) {
    const bed = new THREE.Mesh(new THREE.BoxGeometry(B.length, B.width, B.height), mat('#2b2d2f', { roughness: 0.9 }));
    bed.position.set(0, y, B.height / 2); g.add(bed);
    for (const ry of B.rows) for (let i = 0; i < perBed; i++) {
      const s = 0.75 + 0.3 * rand();
      dummy.position.set(-B.length / 2 + B.pitch * (i + 0.5), y + ry, B.canopy - B.plant_r * s);
      dummy.scale.set(s, s, s * 0.9); dummy.rotation.z = rand() * 6.3; dummy.updateMatrix();
      plants.setMatrixAt(k++, dummy.matrix);
    }
    for (const sy of [-1, 1]) for (let x = -L / 2 + T.supports.pitch / 2; x < L / 2; x += T.supports.pitch) {
      const post = new THREE.Mesh(new THREE.CylinderGeometry(T.supports.od / 2, T.supports.od / 2, T.supports.height, 12), mat('#6d6d6d'));
      post.rotation.x = Math.PI / 2; post.position.set(x, y + sy * (B.width / 2 + 60), T.supports.height / 2); g.add(post);
    }
  }
  g.add(plants);
  // Hoops: vertical side walls, then an elliptical arch to the ridge.
  const prof = [V(0, -a, 0), V(0, -a, T.wall)];
  for (let i = 1; i < 48; i++) { const t = Math.PI - Math.PI * i / 48; prof.push(V(0, a * Math.cos(t), T.wall + b * Math.sin(t))); }
  prof.push(V(0, a, T.wall), V(0, a, 0));
  const steel = mat('#b8bec5', { metalness: 0.6, roughness: 0.4 });
  const hoops = Math.round(L / T.hoop_pitch);
  for (let h = 0; h <= hoops; h++) {
    const x = -L / 2 + h * T.hoop_pitch;
    const path = new THREE.CurvePath();
    for (let i = 0; i < prof.length - 1; i++) path.add(new THREE.LineCurve3(prof[i].clone().setX(x), prof[i + 1].clone().setX(x)));
    g.add(new THREE.Mesh(new THREE.TubeGeometry(path, 200, T.hoop_od / 2, 8, false), steel));
  }
  const along = (y, z, od, m) => {
    const p = new THREE.Mesh(new THREE.CylinderGeometry(od / 2, od / 2, L, 12), m);
    p.rotation.z = Math.PI / 2; p.position.set(0, y, z); return p;
  };
  g.add(along(0, T.ridge, 34, steel), along(-a, T.wall, 34, steel), along(a, T.wall, 34, steel));
  // Film: translucent, open at both ends so the camera can look in.
  const fp = [], fi = [];
  prof.forEach(p => { fp.push(-L / 2, p.y, p.z, L / 2, p.y, p.z); });
  for (let i = 0; i < prof.length - 1; i++) { const j = 2 * i; fi.push(j, j + 1, j + 2, j + 1, j + 3, j + 2); }
  const film = new THREE.BufferGeometry();
  film.setAttribute('position', new THREE.Float32BufferAttribute(fp, 3)); film.setIndex(fi); film.computeVertexNormals();
  g.add(new THREE.Mesh(film, new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.13, depthWrite: false,
                                                               side: THREE.DoubleSide, roughness: 0.3 })));
  // Lights over the centre row, overhead irrigation over the paths.
  const lamp = mat('#f4f1e8', { emissive: new THREE.Color('#fff3c4'), emissiveIntensity: 0.35 });
  const [lx, ly, lz] = T.lights.size;
  for (let x = -L / 2 + T.lights.pitch / 2; x < L / 2; x += T.lights.pitch) {
    const l = new THREE.Mesh(new THREE.BoxGeometry(lx, ly, lz), lamp); l.position.set(x, 0, T.lights.z); g.add(l);
    const hang = new THREE.Mesh(new THREE.CylinderGeometry(3, 3, T.ridge - T.lights.z, 6), mat('#555'));
    hang.rotation.x = Math.PI / 2; hang.position.set(x, 0, (T.ridge + T.lights.z) / 2); g.add(hang);
  }
  for (const y of T.irrigation.y) g.add(along(y, T.irrigation.z, T.irrigation.od, mat('#2f5d8a')));
  // The flight line along the centre row.
  const fl = new THREE.Line(new THREE.BufferGeometry().setFromPoints([V(-L / 2, 0, man.fly_z), V(L / 2, 0, man.fly_z)]),
                            new THREE.LineDashedMaterial({ color: 0xc62828, dashSize: 250, gapSize: 160 }));
  fl.computeLineDistances(); g.add(fl);
  const ax = T.aircraft_x;
  tunnelLabels = [
    { p: V(ax + 2600, 0, man.fly_z), text: 'flight line, 1.5 m up', color: '#c62828' },
    { p: V(ax + 3200, B.y[1], B.canopy), text: 'canopy ≈ 0.6 m', color: '#2e7d32' },
    { p: V(-L / 2 + T.lights.pitch * 1.5, 0, T.lights.z + 60), text: `lights ${(T.lights.z / 1000).toFixed(1)} m` },

  const shot = new Map();
  async function postOk(url, body) {
    for (let k = 1; ; k++) {
      try {
        const res = await fetch(url, { method: 'POST', body });
        await res.text();
        if (res.ok) return;
        if (res.status < 500) k = 4;
        throw new Error(`HTTP ${res.status}`);
      } catch (e) {
        if (k >= 4) { document.title = `capture-error ${url}`; status.textContent = `capture failed: ${url}`; throw e; }
        await new Promise(r => setTimeout(r, 500 * k));
      }
    }
  }
  async function snap(withLabels) {
    draw();
    const blob = await new Promise(r => renderer.domElement.toBlob(r, 'image/png'));
    if (!withLabels && mode !== 'status') return blob;
    const img = await createImageBitmap(blob);
    const c = document.createElement('canvas');
    c.width = img.width; c.height = img.height;
    const g = c.getContext('2d');
    g.drawImage(img, 0, 0);
    if (withLabels) drawLabels(g, img.width, img.height, 1.3);
    if (mode === 'status') drawLegend(g, img.width, img.height, 1.3);
    return new Promise(r => c.toBlob(r, 'image/png'));
  }
  function setState(s) {
    mode = s.mode; applyLook(); setVariant(s.variant);
    if (tunnelOn !== s.tunnel) setTunnel(s.tunnel);
    fovOn = fovGroup.visible = s.fov; dimsOn = dimGroup.visible = s.dims; labelsOn = s.labels;
    cmpSets.forEach((g, i) => g.visible = s.compare.includes(i));
    anim.b = anim.bTo = s.burst; pose();
  }
  for (const s of onlyGifs ? [] : shots) {
    setState(s);
    frameView(s.view, camera.aspect);
    const blob = await snap(s.labels || s.fov || s.dims || s.compare.length || s.tunnel);
    shot.set(s.name, await createImageBitmap(blob));
    await postOk(`/__capture__/${s.name}.png`, blob);
    status.textContent = `captured ${s.name}`;
  }
  if (!onlyGifs) {
    const tiles = [['01_iso_front', '3/4 front, 1 L releaser'], ['07_reuse_replace_add', 'reuse / replace / add'],
                   ['08_burst', 'burst view'], ['09_sensor_fields_of_view', 'sensor fields of view'],
                   ['10_size_vs_x500_and_starling', 'size vs X500 and Starling 2 Max'],
                   ['13_in_a_high_tunnel', 'in a high tunnel (illustrative)'],
                   ['14_along_the_row', 'along the row'], ['11_releaser_2l', '2 L releaser'], ['12_releaser_4l', '4 L releaser (not feasible)']];
    const W = 640, H = 400, cols = 3;
    const c = document.createElement('canvas');
    c.width = W * cols; c.height = H * Math.ceil(tiles.length / cols);
    const g = c.getContext('2d');
    g.fillStyle = '#eef1f4'; g.fillRect(0, 0, c.width, c.height);
    g.font = '18px system-ui, sans-serif';
    tiles.forEach(([n, label], i) => {
      const x = (i % cols) * W, y = Math.floor(i / cols) * H;
      g.drawImage(shot.get(n), x, y, W, H);
      g.fillStyle = '#ffffffd9'; g.fillRect(x + 8, y + 8, g.measureText(label).width + 18, 30);
      g.fillStyle = '#222'; g.fillText(label, x + 17, y + 29);
      g.strokeStyle = '#c3c9d0'; g.strokeRect(x + 0.5, y + 0.5, W - 1, H - 1);
    });
    await postOk('/__capture__/00_overview.png', await new Promise(r => c.toBlob(r, 'image/png')));
  }

  // Animations: each frame goes to serve_viewer.py with how long it shows; the server writes the GIF.
  const place = s => {
    camera.fov = s.fov; camera.up.copy(s.up); camera.position.copy(s.pos); camera.lookAt(s.target);
    camera.updateProjectionMatrix(); controls.target.copy(s.target);
  };
  async function movie(name, frames, width = 800) {
    for (let i = 0; i < frames.length; i++) {
      frames[i].set();
      draw();
      const blob = await new Promise(r => renderer.domElement.toBlob(r, 'image/png'));
      await postOk(`/__frame__/${name}/${i}.png?ms=${frames[i].ms}`, blob);
      status.textContent = `recording ${name} ${i + 1}/${frames.length}`;
    }
    await postOk(`/__movie__/${name}.gif?w=${width}`);
  }
  function swing(set, n, ms, hold) {
    const f = [{ set: () => set(0), ms: hold }];
    for (let k = 1; k <= n; k++) f.push({ set: () => set(k / n), ms: k === n ? hold : ms });
    for (let k = n - 1; k >= 1; k--) f.push({ set: () => set(k / n), ms });
    return f;
  }
  function fitOver(view, states) {
    const pts = [];
    for (const st of states) { st(); for (const p of framePoints(view)) pts.push(p); }
    return viewSpec(view, camera.aspect, pts);
  }
  function orbit(view, n) {
    const f0 = view.dir.clone().normalize(), el = Math.asin(-f0.z), az0 = Math.atan2(f0.y, f0.x);
    const fov = view.fov || 30, tv = Math.tan(rad(fov / 2)), th = tv * camera.aspect;
    const pts = framePoints(view), t = new THREE.Box3().setFromPoints(pts).getCenter(V(0, 0, 0)), q = V(0, 0, 0);
    let d = 0;
    const axes = [];
    for (let i = 0; i < n; i++) {
      const az = az0 + 2 * Math.PI * i / n;
      const f = V(Math.cos(az) * Math.cos(el), Math.sin(az) * Math.cos(el), -Math.sin(el));
      const r = new THREE.Vector3().crossVectors(f, V(0, 0, 1)).normalize();
      const u = new THREE.Vector3().crossVectors(r, f).normalize();
      for (const p of pts) {
        q.subVectors(p, t);
        d = Math.max(d, Math.abs(q.dot(r)) / th - q.dot(f), Math.abs(q.dot(u)) / tv - q.dot(f));
      }
      axes.push([f, u]);
    }
    return axes.map(([f, u]) => ({ pos: t.clone().addScaledVector(f, -1.04 * d), target: t, up: u, fov }));
  }
  setState(S('rest', 'iso_front'));
  labelsOn = false; gridOn = false;
  const spin = orbit(VIEWS.iso_front, 60);
  await movie('anim_turntable', spin.map((s, i) => ({ set: () => { place(s); props.forEach(p => p.rotation.z = p.userData.dir * i * 0.9); }, ms: 60 })));
  const at = k => { anim.b = anim.bTo = k; pose(); };
  place(fitOver(VIEWS.burst_iso, [() => at(0), () => at(1)]));
  await movie('anim_burst', swing(at, 30, 45, 1200));
  at(0);
  await postOk('/__done__');
  document.title = 'capture-done';
  status.textContent = 'capture done';
}
</script>
</body>
</html>
